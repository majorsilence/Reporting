name: linux

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore MajorsilenceReporting-Linux-GtkViewer.slnx
      - name: Build GtkViewer
        run: dotnet build -c Release-DrawingCompat MajorsilenceReporting-Linux-GtkViewer.slnx
      - name: Build MajorsilenceReporting DrawingCompat
        run: dotnet build -c Release-DrawingCompat MajorsilenceReporting.slnx
      - name: Test
        run: dotnet test -c Release-DrawingCompat MajorsilenceReporting.slnx --verbosity normal --collect:"XPlat Code Coverage" --logger:"trx"
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: unit tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
      - name: Build Majorsilence.Forms track (*.Forms projects)
        shell: bash
        run: |
          set -e
          for proj in $(find . -maxdepth 2 -path "*.Forms/*.csproj" -not -path "*.Forms.Tests/*"); do
            echo "::group::dotnet build $proj"
            dotnet build -c Release "$proj"
            echo "::endgroup::"
          done
      - name: Test Majorsilence.Forms track (Headless backend)
        shell: bash
        run: |
          set -e
          for proj in $(find . -maxdepth 2 -path "*.Forms.Tests/*.csproj"); do
            echo "::group::dotnet test $proj"
            dotnet test -c Release "$proj"
            echo "::endgroup::"
          done
      - name: Build AOT Linux x64
        id: aot_build
        shell: pwsh
        run: ./build-release-aot-linux.ps1 -Arch x64
      - name: Archive AOT artifacts
        uses: actions/upload-artifact@v6
        with:
          name: majorsilence-reporting-aot-linux-x64-${{ steps.aot_build.outputs.version }}
          path: Release-Builds/build-output/*.zip
          retention-days: 1

  linux-arm64-aot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build AOT Linux arm64
        id: aot_build
        shell: pwsh
        run: ./build-release-aot-linux.ps1 -Arch arm64
      - name: Archive AOT artifacts
        uses: actions/upload-artifact@v6
        with:
          name: majorsilence-reporting-aot-linux-arm64-${{ steps.aot_build.outputs.version }}
          path: Release-Builds/build-output/*.zip
          retention-days: 1
