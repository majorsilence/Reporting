name: linux

permissions:
  contents: read

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build GtkViewer
        run: dotnet build/build.cs -- --target=BuildGtkViewer
      - name: Build MajorsilenceReporting
        run: dotnet build/build.cs -- --target=Build
      - name: Download Microsoft RDL schemas
        # Lets the schema validation tests in ReportTests run (see ReportTests/Schemas/README.md).
        # Best effort: if a download fails the matching test is skipped rather than failing the build.
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/rdl-xsd"
          for v in 2008 2010; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/rdl-xsd/$v.xsd" \
              "https://schemas.microsoft.com/sqlserver/reporting/$v/01/reportdefinition/ReportDefinition.xsd" \
              && echo "RDL_XSD_$v=$RUNNER_TEMP/rdl-xsd/$v.xsd" >> "$GITHUB_ENV"
          done
          python3 -I ReportTests/Schemas/extract-rdl2016-xsd.py "$RUNNER_TEMP/rdl-xsd/2016.xsd" \
            && echo "RDL_XSD_2016=$RUNNER_TEMP/rdl-xsd/2016.xsd" >> "$GITHUB_ENV"
      - name: Test
        run: dotnet build/build.cs -- --target=Test
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: unit tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
      - name: Allocation gate
        # Fails when rendering allocates over 20% more bytes per report than docs/performance/allocation-baseline.json.
        # Intended increase: run `dotnet run -c Release -f net10.0 --project Majorsilence.Reporting.Benchmarks -- gate --update`.
        run: dotnet build/build.cs -- --target=AllocationGate
      - name: SBOM
        uses: CycloneDX/gh-dotnet-generate-sbom@v1
        with:
          path: ./MajorsilenceReporting.slnx
      - name: Archive SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.xml
          retention-days: 1
      - name: Build AOT Linux x64
        id: aot_build
        run: dotnet build/build.cs -- --target=Aot --arch=x64
      # End to end: the published rdlnative shared library, driven from a host language through the
      # Python wrapper's own test suite (renders a SQLite report, so it also covers the AOT database
      # provider registration in RdlNative).
      - name: Check out the Python wrapper
        uses: actions/checkout@v6
        with:
          repository: majorsilence/reporting-python
          path: reporting-python
      - name: Run the Python wrapper tests against the AOT rdlnative library
        env:
          RDLNATIVE_LIB: ${{ github.workspace }}/RdlNative/bin/Release/net10.0/linux-x64-aot/publish/rdlnative.so
          REPORTING_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/reporting-python/src
        # SalesReport.rdl reads sqlitetestdb2.db from the working directory when no rows are supplied
        # (the empty-dataset tests), as the SetDataFromCode example copies it next to its exe.
        run: |
          cp Examples/SqliteExamples/sqlitetestdb2.db .
          python3 -m unittest discover -s reporting-python/tests -p "test_report_native.py" -v
      # The same end-to-end check for the Ruby, PHP and Rust wrappers. Each wrapper's own native
      # test suite renders reports through the published AOT library; the wrappers' default branches
      # are checked out, so a wrapper that stops working against the library fails this job.
      - name: Check out the Ruby wrapper
        uses: actions/checkout@v6
        with:
          repository: majorsilence/reporting-ruby
          path: reporting-ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: reporting-ruby
      - name: Run the Ruby wrapper tests against the AOT rdlnative library
        working-directory: reporting-ruby
        env:
          RDLNATIVE_LIB: ${{ github.workspace }}/RdlNative/bin/Release/net10.0/linux-x64-aot/publish/rdlnative.so
          REPORTING_REPO_ROOT: ${{ github.workspace }}
        run: |
          cp ../Examples/SqliteExamples/sqlitetestdb2.db .
          bundle exec ruby -Ilib test/test_report_native.rb
      - name: Check out the PHP wrapper
        uses: actions/checkout@v6
        with:
          repository: majorsilence/reporting-php
          path: reporting-php
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ffi
          tools: composer
          coverage: none
      - name: Run the PHP wrapper tests against the AOT rdlnative library
        working-directory: reporting-php
        env:
          RDLNATIVE_LIB: ${{ github.workspace }}/RdlNative/bin/Release/net10.0/linux-x64-aot/publish/rdlnative.so
          REPORTING_REPO_ROOT: ${{ github.workspace }}
        run: |
          cp ../Examples/SqliteExamples/sqlitetestdb2.db .
          composer install --no-interaction --prefer-dist
          ./vendor/bin/phpunit
      - name: Check out the Rust wrapper
        uses: actions/checkout@v6
        with:
          repository: majorsilence/reporting-rust
          path: reporting-rust
      - name: Run the Rust wrapper tests against the AOT rdlnative library
        working-directory: reporting-rust
        env:
          RDLNATIVE_LIB: ${{ github.workspace }}/RdlNative/bin/Release/net10.0/linux-x64-aot/publish/rdlnative.so
          REPORTING_REPO_ROOT: ${{ github.workspace }}
        run: cargo test --test integration
      # Report <Code> blocks are compiled at build time (RdlCodeGen) and then run natively.
      - name: Publish and run the build-time <Code> example under Native AOT
        run: dotnet build/build.cs -- --target=AotPrecompiledCode
      - name: Archive AOT artifacts
        uses: actions/upload-artifact@v6
        with:
          name: majorsilence-reporting-aot-linux-x64-${{ steps.aot_build.outputs.version }}
          path: Release-Builds/build-output/*.zip
          retention-days: 1

  # Signed and encrypted+signed PDFs, checked by an independent validator. Majorsilence.Pdf's own reader
  # and writer can agree on a mistake every other reader rejects (#363: signature strings in cleartext
  # inside an encrypted PDF), so the unit tests alone are not enough.
  pdf-signature-validation:
    runs-on: ubuntu-latest
    env:
      MAJORSILENCE_PDF_VALIDATION_DIR: ${{ github.workspace }}/pdf-validation-samples
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pyHanko
        run: python -m pip install "pyhanko==0.37.0" "pyhanko-certvalidator==0.32.1"
      - name: Write signed PDF samples
        run: dotnet build/build.cs -- --target=PdfValidationSamples
      - name: Validate PDF signatures with pyHanko
        run: python .github/scripts/validate_pdf_signatures.py "$MAJORSILENCE_PDF_VALIDATION_DIR"
      - name: Archive PDF samples
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pdf-validation-samples
          path: ${{ github.workspace }}/pdf-validation-samples
          retention-days: 7

  # PDF/A reports and Majorsilence.Pdf documents, checked by veraPDF against the flavour each one claims.
  # Our own tests only look for the entries known to be needed (#682).
  pdfa-validation:
    runs-on: ubuntu-latest
    env:
      MAJORSILENCE_PDFA_VALIDATION_DIR: ${{ github.workspace }}/pdfa-validation-samples
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install veraPDF
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/verapdf-installer.zip" \
            "https://software.verapdf.org/releases/verapdf-installer.zip"
          unzip -q "$RUNNER_TEMP/verapdf-installer.zip" -d "$RUNNER_TEMP/verapdf-installer"
          cat > "$RUNNER_TEMP/auto-install.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>$RUNNER_TEMP/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          "$RUNNER_TEMP"/verapdf-installer/verapdf-greenfield-*/verapdf-install "$RUNNER_TEMP/auto-install.xml"
          "$RUNNER_TEMP/verapdf/verapdf" --version
      - name: Write PDF/A samples
        run: dotnet build/build.cs -- --target=PdfAValidationSamples
      - name: Validate PDF/A samples with veraPDF
        run: python3 -I .github/scripts/validate_pdfa.py "$RUNNER_TEMP/verapdf/verapdf" "$MAJORSILENCE_PDFA_VALIDATION_DIR"
      - name: Archive PDF/A samples
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pdfa-validation-samples
          path: ${{ github.workspace }}/pdfa-validation-samples
          retention-days: 7

  linux-arm64-aot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build AOT Linux arm64
        id: aot_build
        run: dotnet build/build.cs -- --target=Aot --arch=arm64
      - name: Archive AOT artifacts
        uses: actions/upload-artifact@v6
        with:
          name: majorsilence-reporting-aot-linux-arm64-${{ steps.aot_build.outputs.version }}
          path: Release-Builds/build-output/*.zip
          retention-days: 1
