name: linux

permissions:
  contents: read

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore MajorsilenceReporting-Linux-GtkViewer.slnx
      - name: Build GtkViewer
        run: dotnet build -c Release MajorsilenceReporting-Linux-GtkViewer.slnx
      - name: Build MajorsilenceReporting
        run: dotnet build -c Release MajorsilenceReporting.slnx
      - name: Test
        run: dotnet test -c Release MajorsilenceReporting.slnx --filter "TestCategory!=Containers" --verbosity normal --collect:"XPlat Code Coverage" --logger:"trx"
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: unit tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
      - name: SBOM
        uses: CycloneDX/gh-dotnet-generate-sbom@v1
        with:
          path: ./MajorsilenceReporting.slnx
      - name: Archive SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.xml
          retention-days: 1
      - name: Build AOT Linux x64
        id: aot_build
        shell: pwsh
        run: ./build-release-aot-linux.ps1 -Arch x64
      # End to end: the published rdlnative shared library, driven from a host language through the
      # Python wrapper's own test suite (renders a SQLite report, so it also covers the AOT database
      # provider registration in RdlNative).
      - name: Check out the Python wrapper
        uses: actions/checkout@v6
        with:
          repository: majorsilence/reporting-python
          path: reporting-python
      - name: Run the Python wrapper tests against the AOT rdlnative library
        env:
          RDLNATIVE_LIB: ${{ github.workspace }}/RdlNative/bin/Release/net10.0/linux-x64-aot/publish/rdlnative.so
          REPORTING_REPO_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/reporting-python/src
        run: python3 -m unittest discover -s reporting-python/tests -p "test_report_native.py" -v
      # Report <Code> blocks are compiled at build time (RdlCodeGen) and then run natively.
      - name: Publish and run the build-time <Code> example under Native AOT
        shell: bash
        run: |
          dotnet publish Examples/AotPrecompiledCode/App/App.csproj -c Release -r linux-x64 -o "$RUNNER_TEMP/aotcode"
          cd "$RUNNER_TEMP/aotcode"
          ./AotPrecompiledCode
          test -s score-card.pdf

      - name: Archive AOT artifacts
        uses: actions/upload-artifact@v6
        with:
          name: majorsilence-reporting-aot-linux-x64-${{ steps.aot_build.outputs.version }}
          path: Release-Builds/build-output/*.zip
          retention-days: 1

  # Signed and encrypted+signed PDFs, checked by an independent validator. Majorsilence.Pdf's own reader
  # and writer can agree on a mistake every other reader rejects (#363: signature strings in cleartext
  # inside an encrypted PDF), so the unit tests alone are not enough.
  pdf-signature-validation:
    runs-on: ubuntu-latest
    env:
      MAJORSILENCE_PDF_VALIDATION_DIR: ${{ github.workspace }}/pdf-validation-samples
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pyHanko
        run: python -m pip install "pyhanko==0.37.0" "pyhanko-certvalidator==0.32.1"
      - name: Write signed PDF samples
        run: dotnet test Majorsilence.Pdf.Tests/Majorsilence.Pdf.Tests.csproj -c Release -f net10.0 --filter "TestCategory=PdfValidationSamples" --verbosity normal
      - name: Validate PDF signatures with pyHanko
        run: python .github/scripts/validate_pdf_signatures.py "$MAJORSILENCE_PDF_VALIDATION_DIR"
      - name: Archive PDF samples
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pdf-validation-samples
          path: ${{ github.workspace }}/pdf-validation-samples
          retention-days: 7

  linux-arm64-aot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build AOT Linux arm64
        id: aot_build
        shell: pwsh
        run: ./build-release-aot-linux.ps1 -Arch arm64
      - name: Archive AOT artifacts
        uses: actions/upload-artifact@v6
        with:
          name: majorsilence-reporting-aot-linux-arm64-${{ steps.aot_build.outputs.version }}
          path: Release-Builds/build-output/*.zip
          retention-days: 1
