name: Release

# Builds everything a Majorsilence Reporting release ships and collects it into a DRAFT
# GitHub Release.
#
# - Tag push (v26.0.4 or version_26.0.4) -> builds the zips, installers and NuGet packages on every
#                                           platform, creates the draft release.
# - workflow_dispatch                    -> same builds, artifacts only, no release; a dry run
#                                           before tagging.
#
# The version comes from Directory.Build.props, as it does for build-release.ps1 and the AOT
# scripts. A tag is a claim about that version, so a tag that disagrees with it fails the run
# instead of releasing 26.0.3 packages under a 26.0.4 name.
#
# Publishing to nuget.org is a SEPARATE workflow (publish-nuget.yml), triggered only when a
# human clicks "Publish release" on the draft this workflow creates. This workflow never has
# nuget.org credentials.

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'version_[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::No <Version> in Directory.Build.props"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#version_}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME says $TAG_VERSION but Directory.Build.props says $VERSION"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A SemVer pre-release label ("27.0.0-alpha.1") marks the GitHub Release as a pre-release.
          case "$VERSION" in
            *-*) echo "is_prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "is_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Version: $VERSION"

  # The designer/viewer/rdlcmd zips and every NuGet package. Every project is plain
  # net8.0/net10.0 now, and the Windows self-contained RdlCmd builds are ordinary
  # (non-AOT) publishes, so none of this needs Windows. build-release.ps1 clears build-output
  # when it starts, which is why it is its own job and not a step in front of an AOT build.
  packages:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so SourceLink embeds correct commit info
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build release zips and NuGet packages
        shell: pwsh
        run: ./build-release.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: |
            Release-Builds/build-output/*.zip
            Release-Builds/build-output/*.nupkg
            Release-Builds/build-output/*.snupkg
          if-no-files-found: error

  # Native AOT cannot cross-compile, so the Windows AOT binaries are built on Windows.
  aot-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build AOT Windows
        run: ./build-release-aot-windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: release-aot-windows
          path: Release-Builds/build-output/*.zip
          if-no-files-found: error

  aot:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            script: ./build-release-aot-linux.ps1 -Arch x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            script: ./build-release-aot-linux.ps1 -Arch arm64
          - name: osx
            os: macos-latest
            script: ./build-release-aot-osx.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build AOT ${{ matrix.name }}
        shell: pwsh
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-aot-${{ matrix.name }}
          path: Release-Builds/build-output/*.zip
          if-no-files-found: error

  # Installers for the two desktop apps. Windows gets an Inno Setup .exe, Linux gets .deb and
  # .rpm (via nfpm), Snap and Flatpak bundles are built too. macOS gets a .dmg (apps) or .pkg (RdlCmd). The macOS apps are ad-hoc signed only, so Gatekeeper
  # asks for approval on first launch until a Developer ID is wired in.
  installers-windows:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ReportDesigner, RdlReader, RdlCmd]
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ./installers/windows/build-windows-installer.ps1 -App ${{ matrix.app }} -Rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.app }}-${{ matrix.rid }}
          path: Release-Builds/build-output/installers/*
          if-no-files-found: error

  installers-linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        app: [ReportDesigner, RdlReader, RdlCmd]
        rid: [linux-x64, linux-arm64]
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install nfpm and ImageMagick
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm imagemagick rpm
      - name: Build .deb and .rpm
        run: ./installers/linux/build-linux-packages.sh ${{ matrix.app }} ${{ matrix.rid }}
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.app }}-${{ matrix.rid }}
          path: Release-Builds/build-output/installers/*
          if-no-files-found: error

  installers-macos:
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ReportDesigner, RdlReader]
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build .dmg
        run: ./installers/macos/build-macos-dmg.sh ${{ matrix.app }} ${{ matrix.rid }}
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.app }}-${{ matrix.rid }}
          path: Release-Builds/build-output/installers/*
          if-no-files-found: error

  installers-macos-cli:
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build .pkg
        run: ./installers/macos/build-macos-pkg.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v6
        with:
          name: installer-RdlCmd-${{ matrix.rid }}
          path: Release-Builds/build-output/installers/*
          if-no-files-found: error

  installers-snap:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        app: [ReportDesigner, RdlReader, RdlCmd]
        rid: [linux-x64, linux-arm64]
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Build .snap
        run: ./installers/linux/build-snap.sh ${{ matrix.app }} ${{ matrix.rid }}
      - uses: actions/upload-artifact@v6
        with:
          name: installer-snap-${{ matrix.app }}-${{ matrix.rid }}
          path: Release-Builds/build-output/installers/*.snap
          if-no-files-found: error

  installers-flatpak:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        app: [ReportDesigner, RdlReader]
        rid: [linux-x64, linux-arm64]
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder imagemagick
      - name: Build .flatpak
        run: ./installers/linux/build-flatpak.sh ${{ matrix.app }} ${{ matrix.rid }}
      - uses: actions/upload-artifact@v6
        with:
          name: installer-flatpak-${{ matrix.app }}-${{ matrix.rid }}
          path: Release-Builds/build-output/installers/*.flatpak
          if-no-files-found: error

  release:
    needs: [version, packages, aot-windows, aot, installers-windows, installers-linux, installers-macos, installers-macos-cli, installers-snap, installers-flatpak]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.nupkg' -o -name '*.snupkg' \
            -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.pkg' \
            -o -name '*.snap' -o -name '*.flatpak' \) \
            -exec cp {} release/ \;
          ls -lh release

      # Nothing here touches nuget.org: publish-nuget.yml pushes these same packages once a
      # human publishes the draft.
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: Majorsilence Reporting ${{ needs.version.outputs.version }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          files: release/*
