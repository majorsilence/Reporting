name: Release

# Builds everything a Majorsilence Reporting release ships and collects it into a DRAFT
# GitHub Release.
#
# - Tag push (v26.0.4 or version_26.0.4) -> builds the zips and NuGet packages on every
#                                           platform, creates the draft release.
# - workflow_dispatch                    -> same builds, artifacts only, no release; a dry run
#                                           before tagging.
#
# The version comes from Directory.Build.props. A tag is a claim about that version, so a tag
# that disagrees with it fails the run instead of releasing 26.0.3 packages under a 26.0.4 name.
#
# What each step DOES lives in build/build.cs (Cake.Sdk) as a named target; this file keeps what
# only GitHub Actions can do. Reproduce a step locally with the same target:
#     dotnet build/build.cs -- --target=Package
#
# Publishing to nuget.org is a SEPARATE workflow (publish-nuget.yml), triggered only when a
# human clicks "Publish release" on the draft this workflow creates. This workflow never has
# nuget.org credentials.

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'version_[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# One shell everywhere: windows-latest would otherwise default to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # Writes version, is_release and is_prerelease to $GITHUB_OUTPUT; fails when a tag disagrees with
      # the version in Directory.Build.props.
      - id: resolve
        run: dotnet build/build.cs -- --target=Version

  # The designer/viewer/rdlcmd zips and every NuGet package. Every project is plain
  # net8.0/net10.0 now, and the Windows self-contained RdlCmd builds are ordinary
  # (non-AOT) publishes, so none of this needs Windows. The Package target clears build-output
  # when it starts, which is why it is its own job and not a step in front of an AOT build.
  packages:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so SourceLink embeds correct commit info
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build release zips and NuGet packages
        run: dotnet build/build.cs -- --target=Package
      - uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: |
            Release-Builds/build-output/*.zip
            Release-Builds/build-output/*.nupkg
            Release-Builds/build-output/*.snupkg
          if-no-files-found: error

  # Native AOT cannot cross-compile, so the Windows AOT binaries are built on Windows.
  aot-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build AOT Windows
        run: dotnet build/build.cs -- --target=Aot
      - uses: actions/upload-artifact@v6
        with:
          name: release-aot-windows
          path: Release-Builds/build-output/*.zip
          if-no-files-found: error

  aot:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            args: --arch=x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            args: --arch=arm64
          - name: osx
            os: macos-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build AOT ${{ matrix.name }}
        run: dotnet build/build.cs -- --target=Aot ${{ matrix.args }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-aot-${{ matrix.name }}
          path: Release-Builds/build-output/*.zip
          if-no-files-found: error

  release:
    needs: [version, packages, aot-windows, aot]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.nupkg' -o -name '*.snupkg' \) \
            -exec cp {} release/ \;
          ls -lh release

      # Nothing here touches nuget.org: publish-nuget.yml pushes these same packages once a
      # human publishes the draft.
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: Majorsilence Reporting ${{ needs.version.outputs.version }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          files: release/*
