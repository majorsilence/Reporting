name: wasm

permissions:
  contents: read

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  # The wasm apps target net10.0, but the libraries they reference also target net11.0, so the 11.0
  # SDK is required. The workload pins (and why `wasm-tools-net10` is needed) live on the WasmWorkloads
  # target in build/build.cs; each step below runs one Wasm* target.
  pdf-wasm:
    # Publishes Majorsilence.Pdf + Majorsilence.Pdf.Security as a browser-wasm app and runs it under
    # Node, the same way the Native AOT smoke test proves the AOT build actually runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the wasm workloads, publish the browser-wasm smoke test and run it under Node
        run: dotnet build/build.cs -- --target=WasmPdf

  rdl-wasm:
    # Renders reports (expressions, grouping, charts, PDF/HTML/Excel/TIFF, file-based data providers)
    # with RdlEngine published as browser-wasm and run under Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the wasm workloads, publish the browser-wasm smoke test and run it under Node
        run: dotnet build/build.cs -- --target=WasmRdl

  viewers-wasm:
    # The two browser viewer hosts (Avalonia report viewer, Majorsilence.Forms report viewer) must publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Install the wasm workloads and publish both viewers for the browser
        run: dotnet build/build.cs -- --target=WasmViewers
