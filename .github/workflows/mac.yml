name: mac

permissions:
  contents: read

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  mac-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build GtkViewer
        run: dotnet build/build.cs -- --target=BuildGtkViewer
      - name: Build MajorsilenceReporting
        run: dotnet build/build.cs -- --target=Build
      - name: Test
        run: dotnet build/build.cs -- --target=Test
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure() # run this step even if previous step failed
        with:
          name: unit tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
      - name: Build AOT macOS
        id: aot_build
        run: dotnet build/build.cs -- --target=Aot
      - name: Archive AOT artifacts
        uses: actions/upload-artifact@v6
        with:
          name: majorsilence-reporting-aot-osx-${{ steps.aot_build.outputs.version }}
          path: Release-Builds/build-output/*.zip
          retention-days: 1
