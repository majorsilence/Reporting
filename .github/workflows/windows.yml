name: windows

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  # Windows keeps what only a Windows machine can do: the Windows Native AOT binaries (AOT cannot
  # cross-compile) and the full test run on Windows, where System.Drawing/font behaviour differs.
  # Release zips, NuGet packages and the SBOM are built on Linux (linux.yml, release.yml).
  windows-build:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build AOT Windows
        id: aot_build
        run: ./build-release-aot-windows.ps1
      - name: Archive AOT artifacts
        uses: actions/upload-artifact@v6
        with:
          name: majorsilence-reporting-aot-windows-${{ steps.aot_build.outputs.version }}
          path: Release-Builds/build-output/*-windows-*.zip
          retention-days: 1
      - name: Test
        run: dotnet test -c Release MajorsilenceReporting.slnx --filter "TestCategory!=Containers" --verbosity normal --collect:"XPlat Code Coverage" --logger:"trx"
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure() # run this step even if previous step failed
        with:
          name: unit tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
