name: windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-build:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build Release
        id: build_release
        run: ./build-release.ps1
      - name: Test
        run: dotnet test -c Release MajorsilenceReporting.sln --verbosity normal --collect:"XPlat Code Coverage" --logger:"trx"
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure() # run this step even if previous step failed
        with:
          name: unit tests
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
      - name: SBOM
        uses: CycloneDX/gh-dotnet-generate-sbom@v1
        with:
          path: ./MajorsilenceReporting.sln
      - name: Archive artifacts
        uses: actions/upload-artifact@v6
        with:
          name: majorsilence-reporting-${{ steps.build_release.outputs.version }}
          path: |
            Release-Builds/build-output/*.zip
            Release-Builds/build-output/*.nupkg
            Release-Builds/build-output/*.snupkg
            sbom.xml
          retention-days: 1